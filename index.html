<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Beyond the Stars</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="controls">
    <button id="forward">↑</button>
    <button id="backward">↓</button>
  </div>

  <div class="ee">
    <button id="left">←</button>
    <button id="right">→</button>
  </div>

  <div id="landing">
    <button id="land">هبوط</button>
    <button id="ffn">هبوط من طائرة</button>
  </div>

  <div id="xw">
    <button id="up">↑</button>
    <button id="lt">←</button>
    <button id="rt">→</button>
  </div>

  <div>
    <button id="ksz">عودة الى مركبه</button>
    <button id="evk">تحليق</button>
    <button id="rn">التقط</button>
  </div>

  <!-- تأكد من مطابقة المسار لمكان ملف الصوت الفعلي -->
  <audio id="worldMusic" src="ambient-drone.mp3" loop preload="auto"></audio>
  <script type="module" src="main.js"></script>
</body>
</html>
